[build]
  command = "npm run build"
  publish = "dist"

# Same two headers the dev server sets: onnxruntime-web's threaded WASM needs
# SharedArrayBuffer, which browsers gate behind cross-origin isolation.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# ⚠ NOT immutable. /models/ holds voices.jsonc and voice-codes.json, which are hand-editable and
# regenerated by tools/make-voices-from-corpus.mjs — the ONNX weights come from HuggingFace, not
# from here. Caching these for a year means a returning visitor can hold a stale voices.jsonc
# against a fresh voice-codes.json, which lands as `voice "x" has no codes`.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# The transpiled phonemizer IS content-addressed by build and safe to cache hard.
[[headers]]
  for = "/vphon-data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
