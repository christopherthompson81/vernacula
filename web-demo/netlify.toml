# ⚠ THIS FILE DOES NOT REACH THE DEPLOYED SITE. Netlify reads netlify.toml from the REPOSITORY
# ROOT (or a configured base directory), and this copy lives in web-demo/ — so its headers were
# never applied: `curl -I https://vernacula.netlify.app/` returned no Cross-Origin-* at all, the
# page was not cross-origin isolated, and WASM inference silently ran on one thread.
#
# The headers that DO reach production are in public/_headers, which ships inside the publish
# directory. Edit BOTH, or edit that one. This file is kept for `netlify dev`.

[build]
  command = "npm run build"
  publish = "dist"

# Same two headers the dev server sets: onnxruntime-web's threaded WASM needs
# SharedArrayBuffer, which browsers gate behind cross-origin isolation.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# ⚠ NOT immutable. /models/ holds voices.jsonc and voice-codes.json, which are hand-editable and
# regenerated by tools/make-voices-from-corpus.mjs — the ONNX weights come from HuggingFace, not
# from here. Caching these for a year means a returning visitor can hold a stale voices.jsonc
# against a fresh voice-codes.json, which lands as `voice "x" has no codes`.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# ⚠ NOT content-addressed — the filenames are plain (welsh.jsonc, lexicon.tsv), so caching hard
# leaves a returning visitor on stale phoneme data after a phonemizer deploy. See public/_headers.
[[headers]]
  for = "/vphon-data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/vphon/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
