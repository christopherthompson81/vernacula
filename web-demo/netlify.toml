[build]
  command = "npm run build"
  publish = "dist"

# Same two headers the dev server sets: onnxruntime-web's threaded WASM needs
# SharedArrayBuffer, which browsers gate behind cross-origin isolation.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# Model files are content-addressed by name and never mutate in place; cache hard.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
